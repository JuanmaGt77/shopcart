name: shopcart

services:
  # SQL Server 2022 (la base corre en nivel de compatibilidad 150 = SQL Server 2019)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shopcart-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?Define DB_SA_PASSWORD en el archivo .env}
      TZ: UTC
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - shopcart-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # Corre los scripts numerados de database/scripts. Si la base ya existe no hace nada;
  # para recrearla desde cero: docker compose run --rm db-init --reset
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/database/run-all.sh"]
    command: []
    environment:
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-ShopCart}
      DB_SA_USER: sa
      DB_SA_PASSWORD: ${DB_SA_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:-shopcart_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Define DB_APP_PASSWORD en el archivo .env}
    volumes:
      - ./database:/database:ro
    restart: "no"

  # API (Node 24 + Express). Arranca cuando la base ya terminó de crearse.
  api:
    build: ./backend
    container_name: shopcart-api
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-ShopCart}
      DB_USER: ${DB_APP_USER:-shopcart_app}
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET en el archivo .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # En local se usa http; con HTTPS en producción va en true
      COOKIE_SECURE: "false"
      # El frontend llega a través del nginx del servicio web: se confía en ese proxy para
      # leer la IP real del cliente (la usa el rate limit del login)
      TRUST_PROXY: "1"
    ports:
      - "${API_PORT:-3000}:3000"
    restart: unless-stopped

  # Frontend (React compilado, servido por nginx). Reenvía /api y /socket.io a la API,
  # así el navegador usa un solo origen: http://localhost:8080
  web:
    build: ./frontend
    container_name: shopcart-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  shopcart-sqldata:
